[package]
name = "rosregview"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Offline Windows registry hive viewer for ReactOS"
license = "GPL-2.0-or-later"
repository = "https://github.com/Smicry/rosregview"
readme = "README.md"
keywords = ["reactos", "registry", "hive", "windows", "forensics"]
categories = ["command-line-utilities", "parsing", "os-utilities"]
publish = false

[lib]
name = "rosregview"
path = "src/lib.rs"

[[bin]]
name = "rosregview"
path = "src/main.rs"

[[bin]]
name = "gen-completions"
path = "src/bin/gen-completions.rs"

[dependencies]
nt-hive = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by the gen-completions binary to emit shell completion
# scripts and the man page. Always-on: the build cost is a few
# hundred KB and avoids a Cargo-feature flag for tooling only
# contributors and CI run.
clap_complete = "4"
clap_mangen = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
# A CLI tool that never sees foreign frames doesn't need unwinding.
# This also sidesteps a known link-order mismatch between Rust's
# emitted `panic_unwind` references and MinGW-w64 GCC 16's `libgcc_eh`
# on the i686-pc-windows-gnu target (the Homebrew brew formula's
# `libgcc_eh.a` is intentionally built without `_Unwind_Resume`).
panic = "abort"
